<!DOCTYPE html>
<html lang="en">
<head>

  <title>Global Mobile Phone Penetration</title>

  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --text: #e2e8f0;
      --text-muted: #8892a4;
      --accent: #4f6ef7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }
    header {
      padding: 20px 28px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
    }
    header .logo span { color: var(--accent); }
    header h1 {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-muted);
      border-left: 1px solid var(--border);
      padding-left: 16px;
    }
    .main { padding: 24px 28px; }
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      width: fit-content;
      margin-bottom: 24px;
    }
    .tab {
      padding: 8px 20px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab.active {
      background: var(--accent);
      color: #fff;
    }
    .tab:hover:not(.active) { background: var(--surface2); color: var(--text); }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .grid.single { grid-template-columns: 1fr; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .card-header {
      padding: 14px 18px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .card-year {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
    }
    .card-body { padding: 0; position: relative; }
    .map-container { width: 100%; }
    .map-container svg { display: block; width: 100%; height: auto; }

    .legend {
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }
    .legend-bar {
      flex: 1;
      height: 10px;
      border-radius: 5px;
      background: linear-gradient(to right, #0e2a47, #1565c0, #42a5f5, #80deea, #a5d6a7, #fff9c4, #ffcc02, #ef6c00, #b71c1c);
    }
    .legend-labels {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .tooltip {
      position: fixed;
      background: #1e2235;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      pointer-events: none;
      font-size: 12px;
      z-index: 1000;
      min-width: 160px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .tooltip-country { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
    .tooltip-pct { font-size: 18px; font-weight: 700; color: var(--accent); }
    .tooltip-label { color: var(--text-muted); font-size: 11px; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
    }
    .stat-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .stat-value { font-size: 24px; font-weight: 700; color: var(--accent); }
    .stat-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .comparison-section { margin-top: 16px; }
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .bar-list { display: flex; flex-direction: column; gap: 6px; }
    .bar-row { display: flex; align-items: center; gap: 10px; font-size: 12px; }
    .bar-label { width: 130px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { flex: 1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; position: relative; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
    .bar-pct { width: 38px; text-align: right; color: var(--text-muted); font-size: 11px; }

    .view-toggle {
      display: flex;
      gap: 4px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 3px;
    }
    .view-btn {
      padding: 5px 12px;
      border-radius: 5px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .view-btn.active { background: var(--surface); color: var(--text); }

    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>

// Color scale: dark blue → light blue → green → yellow → orange → deep red
function getColor(val) {
  if (val === null || val === undefined) return '#2a2d3e';
  const v = Math.min(val, 130);
  // stops: 0→#0d2137, 20→#1565c0, 40→#1e88e5, 60→#42a5f5, 80→#80cbc4, 100→#a5d6a7, 115→#fff176, 130→#ef9a9a
  const stops = [
    [0,   [13, 33, 55]],
    [20,  [21, 101, 192]],
    [40,  [30, 136, 229]],
    [60,  [66, 165, 245]],
    [80,  [128, 203, 196]],
    [100, [165, 214, 167]],
    [115, [255, 241, 118]],
    [130, [239, 154, 154]],
  ];
  let i = stops.findIndex(s => s[0] >= v);
  if (i <= 0) return `rgb(${stops[0][1].join(',')})`;
  if (i >= stops.length) return `rgb(${stops[stops.length-1][1].join(',')})`;
  const [v0, c0] = stops[i-1];
  const [v1, c1] = stops[i];
  const t = (v - v0) / (v1 - v0);
  const r = Math.round(c0[0] + t * (c1[0] - c0[0]));
  const g = Math.round(c0[1] + t * (c1[1] - c0[1]));
  const b = Math.round(c0[2] + t * (c1[2] - c0[2]));
  return `rgb(${r},${g},${b})`;
}

let worldData = null;
let currentView = 'quad';
let currentSingleYear = 2005;

async function loadMap() {
  const res = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json');
  worldData = await res.json();
  renderAll();
}

function drawMap(containerId, year, width) {
  const data = DATA[year];
  const container = document.getElementById(containerId);
  container.innerHTML = '';

  const h = Math.round(width * 0.52);
  const svg = d3.select(`#${containerId}`)
    .append('svg')
    .attr('viewBox', `0 0 ${width} ${h}`)
    .attr('preserveAspectRatio', 'xMidYMid meet');

  const projection = d3.geoNaturalEarth1()
    .scale(width / 6.4)
    .translate([width / 2, h / 2]);

  const path = d3.geoPath().projection(projection);
  const countries = topojson.feature(worldData, worldData.objects.countries);

  const tooltip = document.getElementById('tooltip');

  svg.selectAll('path')
    .data(countries.features)
    .join('path')
    .attr('d', path)
    .attr('fill', d => {
      const alpha3 = NUM_TO_ALPHA3[+d.id];
      const val = alpha3 ? data[alpha3] : null;
      return getColor(val);
    })
    .attr('stroke', '#0f1117')
    .attr('stroke-width', 0.4)
    .on('mousemove', function(event, d) {
      const alpha3 = NUM_TO_ALPHA3[+d.id];
      const val = alpha3 ? data[alpha3] : null;
      const name = COUNTRY_NAMES[alpha3] || alpha3 || 'Unknown';
      tooltip.style.display = 'block';
      tooltip.style.left = (event.clientX + 14) + 'px';
      tooltip.style.top = (event.clientY - 10) + 'px';
      tooltip.innerHTML = `
        <div class="tooltip-country">${name}</div>
        <div class="tooltip-pct">${val !== null && val !== undefined ? val + '%' : 'No data'}</div>
        <div class="tooltip-label">Mobile subscriptions per 100 people · ${year}</div>
      `;
    })
    .on('mouseleave', () => { tooltip.style.display = 'none'; });
}

function renderQuad() {
  const grid = document.getElementById('quad-grid');
  grid.innerHTML = '';
  const statsRow = document.getElementById('global-stats');
  statsRow.innerHTML = '';

  // Global avg for each year
  const yearLabels = {2005:'20 Years Ago',2015:'10 Years Ago',2020:'5 Years Ago',2025:'Today'};
  YEARS.forEach(year => {
    const vals = Object.values(DATA[year]);
    const avg = Math.round(vals.reduce((a,b) => a+b, 0) / vals.length);
    const stat = document.createElement('div');
    stat.className = 'stat-card';
    stat.innerHTML = `
      <div class="stat-label">${yearLabels[year]}</div>
      <div class="stat-value">${avg}%</div>
      <div class="stat-sub">Avg. subscriptions / 100 people · ${year}</div>
    `;
    statsRow.appendChild(stat);
  });

  YEARS.forEach(year => {
    const card = document.createElement('div');
    card.className = 'card';
    const mapId = `map-${year}`;
    card.innerHTML = `
      <div class="card-header">
        <span class="card-title">Mobile Penetration</span>
        <span class="card-year">${year}</span>
      </div>
      <div class="card-body">
        <div class="map-container" id="${mapId}"></div>
      </div>
      <div class="legend">
        <div style="flex:1; display:flex; flex-direction:column;">
          <div class="legend-bar"></div>
          <div class="legend-labels"><span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%+</span></div>
        </div>
      </div>
    `;
    grid.appendChild(card);
    // Draw after DOM is ready
    requestAnimationFrame(() => {
      const w = document.getElementById(mapId).parentElement.clientWidth || 560;
      drawMap(mapId, year, w);
    });
  });
}

function renderSingle(year) {
  document.getElementById('single-title').textContent = `Mobile Penetration — ${year}`;
  document.getElementById('single-year-label').textContent = year;
  requestAnimationFrame(() => {
    const w = document.getElementById('single-map').parentElement.clientWidth || 900;
    drawMap('single-map', year, w);
  });
}

function renderTrend() {
  // Top gainers
  const gainers = Object.keys(DATA[2025]).map(iso => {
    const v05 = DATA[2005][iso] || 0;
    const v25 = DATA[2025][iso] || 0;
    return { iso, gain: v25 - v05, v05, v25, name: COUNTRY_NAMES[iso] || iso };
  }).sort((a,b) => b.gain - a.gain).slice(0, 15);

  const gainerEl = document.getElementById('top-gainers');
  gainerEl.innerHTML = '<div class="bar-list">' + gainers.map(g => `
    <div class="bar-row">
      <div class="bar-label">${g.name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.min(g.v25/2,100)}%;background:linear-gradient(90deg,#1565c0,#42a5f5)"></div></div>
      <div class="bar-pct">+${g.gain}pp</div>
    </div>
  `).join('') + '</div>';

  // Regional leaders 2025
  const regions = {
    'Middle East': ['ARE','SAU','KWT','QAT','OMN','ISR','JOR','LBN','IRN','IRQ','SYR','YEM'],
    'East Asia': ['HKG','JPN','KOR','CHN','TWN','MNG','PRK'],
    'SE Asia': ['SGP','MYS','THA','VNM','PHL','IDN','KHM','MMR','LAO'],
    'Europe': ['LUX','FIN','AUT','ITA','LTU','BGR','DEU','FRA','GBR','NLD','POL','ESP','PRT','CZE'],
    'Americas': ['URY','ARG','CHL','BRA','CRI','PAN','MEX','USA','CAN','COL','PER'],
    'Africa': ['GAB','BWA','ZAF','CIV','GHA','NGA','KEN','SEN','ETH','TZA'],
    'South Asia': ['MDV','LKA','BGD','NPL','PAK','IND','BTN','AFG'],
  };
  const regLeaders = Object.entries(regions).map(([region, isos]) => {
    const vals = isos.map(iso => DATA[2025][iso]).filter(Boolean);
    const avg = Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
    return { region, avg };
  }).sort((a,b) => b.avg - a.avg);

  const regEl = document.getElementById('regional-leaders');
  const maxVal = regLeaders[0].avg;
  regEl.innerHTML = '<div class="bar-list">' + regLeaders.map(r => `
    <div class="bar-row">
      <div class="bar-label">${r.region}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(r.avg/maxVal*100).toFixed(1)}%;background:linear-gradient(90deg,#4f6ef7,#80deea)"></div></div>
      <div class="bar-pct">${r.avg}%</div>
    </div>
  `).join('') + '</div>';

  // Timeline SVG chart
  const globalAvgs = YEARS.map(y => {
    const vals = Object.values(DATA[y]);
    return { year: y, avg: vals.reduce((a,b)=>a+b,0)/vals.length };
  });

  const W = 800, H = 200, pad = { top: 20, right: 30, bottom: 30, left: 50 };
  const xScale = d3.scaleLinear().domain([2005, 2025]).range([pad.left, W - pad.right]);
  const yScale = d3.scaleLinear().domain([0, 130]).range([H - pad.bottom, pad.top]);

  const chartEl = document.getElementById('timeline-chart');
  chartEl.innerHTML = '';
  const svg = d3.select('#timeline-chart').append('svg')
    .attr('viewBox', `0 0 ${W} ${H}`)
    .attr('preserveAspectRatio', 'xMidYMid meet')
    .style('width','100%').style('height','auto');

  // Grid lines
  [25,50,75,100,125].forEach(v => {
    svg.append('line')
      .attr('x1', pad.left).attr('x2', W - pad.right)
      .attr('y1', yScale(v)).attr('y2', yScale(v))
      .attr('stroke', '#2e3350').attr('stroke-dasharray', '3,3');
    svg.append('text')
      .attr('x', pad.left - 6).attr('y', yScale(v) + 4)
      .attr('fill', '#8892a4').attr('font-size', 10).attr('text-anchor', 'end')
      .text(v + '%');
  });

  // Area
  const area = d3.area()
    .x(d => xScale(d.year))
    .y0(yScale(0))
    .y1(d => yScale(d.avg))
    .curve(d3.curveMonotoneX);
  svg.append('path')
    .datum(globalAvgs)
    .attr('d', area)
    .attr('fill', 'rgba(79,110,247,0.15)');

  // Line
  const line = d3.line()
    .x(d => xScale(d.year))
    .y(d => yScale(d.avg))
    .curve(d3.curveMonotoneX);
  svg.append('path')
    .datum(globalAvgs)
    .attr('d', line)
    .attr('fill', 'none')
    .attr('stroke', '#4f6ef7')
    .attr('stroke-width', 2.5);

  // Dots + labels
  globalAvgs.forEach(d => {
    svg.append('circle')
      .attr('cx', xScale(d.year)).attr('cy', yScale(d.avg))
      .attr('r', 5).attr('fill', '#4f6ef7').attr('stroke', '#0f1117').attr('stroke-width', 2);
    svg.append('text')
      .attr('x', xScale(d.year)).attr('y', yScale(d.avg) - 10)
      .attr('fill', '#e2e8f0').attr('font-size', 11).attr('text-anchor', 'middle')
      .text(d.avg.toFixed(0) + '%');
    svg.append('text')
      .attr('x', xScale(d.year)).attr('y', H - pad.bottom + 16)
      .attr('fill', '#8892a4').attr('font-size', 10).attr('text-anchor', 'middle')
      .text(d.year);
  });

  svg.append('text')
    .attr('x', W/2).attr('y', H - 2)
    .attr('fill', '#8892a4').attr('font-size', 10).attr('text-anchor', 'middle')
    .text('Global average mobile subscriptions per 100 people');
}

function setView(view) {
  currentView = view;
  document.querySelectorAll('.tabs:first-of-type .tab').forEach((b,i) => {
    b.classList.toggle('active', ['quad','single','trend'][i] === view);
  });
  document.getElementById('view-quad').style.display = view === 'quad' ? '' : 'none';
  document.getElementById('view-single').style.display = view === 'single' ? '' : 'none';
  document.getElementById('view-trend').style.display = view === 'trend' ? '' : 'none';

  if (view === 'quad') renderQuad();
  if (view === 'single') renderSingle(currentSingleYear);
  if (view === 'trend') renderTrend();
}

function setSingleYear(year) {
  currentSingleYear = year;
  document.querySelectorAll('#view-single .tab').forEach(b => {
    b.classList.toggle('active', +b.textContent === year);
  });
  renderSingle(year);
}

loadMap().then(() => {
  setView('quad');
});
</script>
